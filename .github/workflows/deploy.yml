name: Build & Deploy Jump Quest

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cek semua aset yang direferensikan ada
        run: |
          missing=0
          for f in $(grep -o 'assets/[A-Za-z0-9_./-]*\.\(png\|jpg\)' game.js | sort -u); do
            [ -f "$f" ] || { echo "::error::Aset hilang: $f"; missing=1; }
          done
          [ "$missing" = 0 ]

      - name: Cek sintaks game.js
        run: node --check game.js

      - name: Siapkan folder build
        run: |
          mkdir _site
          cp index.html game.js .nojekyll _site/
          cp -r assets _site/assets

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
